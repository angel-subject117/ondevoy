<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnDeVoy</title>
<style>body{background:#0f0f0f;color:#e5e5e5;font-family:system-ui;margin:0;padding:20px}h1{text-align:center}
.sub{text-align:center;color:#888;margin-bottom:20px}.card{max-width:1100px;margin:0 auto;background:#1a1a1a;border-radius:12px;border:1px solid #2a2a2a;overflow:hidden}
.search-box{max-width:1100px;margin:0 auto 16px auto;display:flex}input{flex:1;padding:14px;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:#888;padding:14px;border-bottom:1px solid #2a2a2a;text-align:left}td{padding:14px;border-bottom:1px solid #222}
.badge{padding:5px 12px;border-radius:20px;font-size:12px}.prog{background:#3a2a1a;color:#f5a623}.curso{background:#3a1a1a;color:#ff5a5a}
.foot{text-align:center;padding:14px;color:#666;font-size:12px}.loading{text-align:center;padding:40px;color:#888}</style>
</head><body>
<h1>OnDeVoy</h1><div class="sub">Cortes programados de EPEC - Córdoba - Datos oficiales</div>
<div class="search-box"><input id="buscador" placeholder="🔍 Filtrar por barrio, ciudad, fecha... Ej: tancacha, 02/10/2026, Cerro"></div>
<div class="card"><div id="content" class="loading">Cargando...</div></div>
<script>
let todos=[];
async function cargar(){
 const r=await fetch('/api/scrape'); const data=await r.json();
 const cortes=Array.isArray(data)?data:(data.cortes||[]); todos=cortes; render(cortes);
}
function render(cortes){
 const cont=document.getElementById('content');
 if(!cortes.length){cont.innerHTML='<div class="loading">No hay cortes</div>';return;}
 let html='<table><tr><th>Fecha / Horario</th><th>Zona / Barrio</th><th>Motivo</th><th>Estado</th></tr>';
 cortes.forEach(c=>{
  const partes=String(c).split(' - ');
  let fecha='',loc='',horario='',motivo='',zona='';
  if(partes[0].match(/\d+\/\d+\/\d+/)){ fecha=partes[0]; loc=partes[1]||''; horario=partes[2]||''; motivo=(partes[3]||'').replace('Motivo:',''); zona=(partes[4]||'').replace('Zona afectada:','');}
  else{ const hoy=new Date(); fecha=`${String(hoy.getDate()).padStart(2,'0')}/${String(hoy.getMonth()+1).padStart(2,'0')}/${hoy.getFullYear()}`; loc=partes[0]||''; horario=partes[1]||''; motivo=(partes[2]||'').replace('Motivo:',''); zona=(partes[3]||'').replace('Zona afectada:','');}
  html+=`<tr><td><b style="color:#fff">${fecha}</b><br><span style="color:#ccc">${horario}</span></td><td><b style="color:#fff">${loc}</b><br><span style="color:#aaa;font-size:12px">${zona.slice(0,200)}</span></td><td>${motivo||'Mantenimiento'}</td><td><span class="badge prog">Programado</span></td></tr>`;
 });
 html+=`</table><div class="foot">epec.com.ar - ${cortes.length} cortes - ${new Date().toLocaleString('es-AR')}</div>`;
 cont.innerHTML=html;
}
document.getElementById('buscador').addEventListener('input',e=>{ const q=e.target.value.toLowerCase(); if(!q)render(todos); else render(todos.filter(c=>String(c).toLowerCase().includes(q)));});
cargar();
</script></body></html>
