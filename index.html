<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnDeVoy - Cortes EPEC Córdoba</title>
<style>
body{background:#0f0f0f;color:#e5e5e5;font-family:system-ui,sans-serif;margin:0;padding:20px}
h1{text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#888;margin-bottom:20px;font-size:14px}
.card{max-width:1000px;margin:0 auto;background:#1a1a1a;border-radius:12px;border:1px solid #2a2a2a;overflow:hidden}
.search-box{max-width:1000px;margin:0 auto 16px auto;display:flex;gap:10px}
.search-box input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;font-size:14px;outline:none}
.search-box input:focus{border-color:#f5a623}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:#888;text-align:left;padding:12px 16px;border-bottom:1px solid #2a2a2a;font-weight:500}
td{padding:12px 16px;border-bottom:1px solid #222;vertical-align:top}
tr:last-child td{border-bottom:none}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.prog{background:#3a2a1a;color:#f5a623}
.curso{background:#3a1a1a;color:#ff5a5a}
.foot{text-align:center;padding:12px;color:#666;font-size:12px}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<h1>OnDeVoy</h1>
<div class="sub">Cortes programados de EPEC - Córdoba - Datos oficiales</div>
<div class="search-box">
<input id="buscador" type="text" placeholder="🔍 Filtrar por barrio, zona, motivo... Ej: Nueva Córdoba, Cerro, Centro">
</div>
<div class="card">
<div id="content" class="loading">Cargando datos oficiales de EPEC...</div>
</div>
<script>
let todosLosCortes = [];
async function cargar(){
  try{
    const cont = document.getElementById('content');
    const r = await fetch('/api/scrape');
    if(!r.ok) throw new Error('API no responde');
    const data = await r.json();
    const cortes = Array.isArray(data)? data : (data.cortes || []);

    todosLosCortes = cortes;
    render(todosLosCortes);
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="loading">Error cargando EPEC: '+e.message+'<br><small>Probá refrescar en 1 min</small></div>';
  }
}
function render(cortes){
    const cont = document.getElementById('content');
    if(!cortes || cortes.length===0){
      cont.innerHTML = '<div class="loading">No hay cortes programados ahora (según EPEC) o no coincide con tu búsqueda</div>';
      return;
    }
    let html = '<table><tr><th>Fecha / Horario</th><th>Zona / Barrio</th><th>Motivo</th><th>Estado</th></tr>';
    cortes.forEach(c => {
      const partes = c.split(' - ');
      const loc = partes[0] || 'CORDOBA';
      const horario = (partes[1] || '').replace('De ', '');
      const motivo = (partes[2] || '').replace('Motivo: ', '');
      const zona = (partes[3] || '').replace('Zona afectada: ', '') || partes[1] || '';
      const esHoy = horario.includes('07:') || horario.includes('08:') || horario.includes('09:');
      const estado = esHoy? '<span class="badge curso">En curso</span>' : '<span class="badge prog">Programado</span>';
      html += '<tr><td>'+(horario || 'A confirmar')+'</td><td><b>'+loc+'</b><br><span style="color:#aaa;font-size:12px">'+zona.slice(0,120)+'</span></td><td>'+(motivo || 'Mantenimiento')+'</td><td>'+estado+'</td></tr>';
    });
    html += '</table><div class="foot">epec.com.ar - '+cortes.length+' cortes - Actualizado '+new Date().toLocaleString('es-AR')+' - ondevoy.vercel.app</div>';
    cont.innerHTML = html;
}
document.getElementById('buscador').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase().trim();
  if(!q){ render(todosLosCortes); return; }
  const filtrados = todosLosCortes.filter(c => c.toLowerCase().includes(q));
  render(filtrados);
});
cargar();
</script>
</body>
</html>
