<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ondevoy</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#121212] text-white p-6">
<h1 class="text-2xl font-bold mb-3">Ondevoy</h1>
<div class="grid grid-cols-2 gap-3">
  <div onclick="abrirModulo('epec')" class="bg-yellow-100 text-black rounded-2xl p-4 cursor-pointer"><h3 class="font-bold">EPEC</h3><p id="epec-status" class="text-xs">Ver cortes reales</p></div>
</div>
<div id="modulo-epec" class="hidden fixed inset-0 bg-[#121212] z-50 p-6 overflow-auto">
  <button onclick="cerrarModulo('epec')" class="bg-white text-black px-5 py-2 rounded-full font-bold">← Volver</button>
  <h2 class="text-2xl font-bold mt-6 mb-4">EPEC - Cortes programados</h2>
  <input id="search" placeholder="Buscá tu barrio..." class="w-full p-3 rounded-xl text-black mb-3">
  <div id="total" class="text-center text-zinc-400 text-sm mb-4">Cargando cortes reales de EPEC...</div>
  <div id="lista-cortes"></div>
</div>
<script>
function abrirModulo(n){document.getElementById('modulo-'+n).classList.remove('hidden')}
function cerrarModulo(n){document.getElementById('modulo-'+n).classList.add('hidden')}
let cortesEPEC=[]; const lista=document.getElementById('lista-cortes'), buscador=document.getElementById('search'), total=document.getElementById('total');
function mostrar(f=""){ lista.innerHTML=""; const fil=cortesEPEC.filter(c=> (c.barrio+' '+c.zona+' '+c.motivo).toLowerCase().includes(f.toLowerCase())); total.textContent=`${fil.length} cortes encontrados`; fil.forEach(c=>{ lista.innerHTML+=`<div class="bg-zinc-800 p-4 rounded-xl mb-2"><b class="text-yellow-200">${c.barrio}</b><br><span class="text-sm">${c.motivo} - ${c.hora}</span><br><span class="text-xs text-zinc-400">${c.zona}</span></div>` }) }
async function cargarReales(){ try{ const res=await fetch('/api/scrape?t='+Date.now()); const data=await res.json(); cortesEPEC = Array.isArray(data)? data : (data.cortes||[]); if(typeof cortesEPEC[0]==='string'){ cortesEPEC = cortesEPEC.map(s=>({barrio:s, hora:'', motivo:s, zona:''})) } document.getElementById('epec-status').textContent=cortesEPEC.length+' cortes hoy'; mostrar(); }catch(e){ total.textContent='Error cargando EPEC: '+e.message } }
buscador.addEventListener('input',e=>mostrar(e.target.value)); cargarReales();
</script>
</body>
</html>
