<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnDevoy - Cortes EPEC</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#91a9d9;color:#1a1a1a;padding:20px}
  .container{max-width:900px;margin:0 auto}
  h1{font-size:28px;text-align:center;margin:20px 0 8px}
  p.sub{text-align:center;color:#666;margin-bottom:20px}
  #search{width:100%;padding:14px 18px;border:2px solid #e5e7eb;border-radius:12px;font-size:16px;outline:none;margin-bottom:12px}
  #search:focus{border-color:#111}
  #total{text-align:center;color:#666;font-size:14px;margin-bottom:16px}
  .corte{background:white;padding:14px 16px;border-radius:10px;margin-bottom:10px;border:1px solid #eef0f3;line-height:1.4;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .corte b{color:#111}
  .empty{text-align:center;padding:40px;color:#888}
  footer{text-align:center;margin-top:30px;color:#999;font-size:12px}
</style>
</head>
 <body class="bg-[#121212] text-white p-4">

  <h1 class="text-2xl font-bold mb-1">OnDeVoy</h1>
  <p class="text-gray-400 text-sm mb-4">Todo Córdoba en un solo lugar</p>

  <!-- GRID DE TARJETITAS - 2 en celu, 3 en web -->
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
    
    <div class="bg-yellow-400 text-black rounded-2xl p-4">
      <div class="text-2xl">⚡</div>
      <h3 class="font-bold mt-2">EPEC</h3>
      <p class="text-xs opacity-80" id="epec-status">Ver cortes</p>
    </div>

    <div class="bg-blue-400 text-black rounded-2xl p-4">
      <div class="text-2xl">💧</div>
      <h3 class="font-bold mt-2">Aguas</h3>
      <p class="text-xs opacity-80" id="aguas-status">Ver cortes</p>
    </div>

    <div class="bg-green-300 text-black rounded-2xl p-4">
      <div class="text-2xl">🏛️</div>
      <h3 class="font-bold mt-2">CPC</h3>
      <p class="text-xs opacity-80">Turnos CPC</p>
    </div>

    <div class="bg-red-400 text-black rounded-2xl p-4">
      <div class="text-2xl">🏥</div>
      <h3 class="font-bold mt-2">Hospitales</h3>
      <p class="text-xs opacity-80">Turnos y guardias</p>
    </div>

    <div class="bg-purple-500 text-white rounded-2xl p-4 border-2 border-white/20">
      <div class="text-2xl">🚌</div>
      <h3 class="font-bold mt-2">Transporte</h3>
      <p class="text-xs opacity-90">Cuándo llega</p>
    </div>

    <div class="bg-orange-300 text-black rounded-2xl p-4">
      <div class="text-2xl">⛅</div>
      <h3 class="font-bold mt-2">Clima</h3>
      <p class="text-xs opacity-80">Alerta hoy</p>
    </div>

  </div>

  <!-- FUTURO ESCALABLE -->
  <div class="flex gap-2 mt-6">
    <button class="bg-white text-black px-4 py-2 rounded-full text-sm font-bold">Servicios</button>
    <button class="bg-zinc-800 text-gray-400 px-4 py-2 rounded-full text-sm">Comercios</button>
    <button class="bg-zinc-800 text-gray-400 px-4 py-2 rounded-full text-sm">Más</button>
  </div>

  <!-- Acá abajo dejá tu script viejo de cortes, no lo borres -->
  <div id="lista-cortes"></div>
  <script src="tu-logica-de-cortes.js"></script>

</body>
</html>
