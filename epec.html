<!DOCTYPE html><html><head><meta charset="UTF-8"><title>EPEC Real</title>
<style>body{font-family:sans-serif;background:#c5ddf6} .corte{background:white;margin:10px;padding:12px;border-radius:10px;border-left:5px solid orange}</style>
</head><body>
<a href="./index.html">← Volver</a>
<input id="f" placeholder="Filtrar barrio..." onkeyup="filtrar()" style="width:90%;padding:10px;margin:10px;border-radius:20px;border:1px solid #999">
<div id="lista">Cargando cortes oficiales de EPEC...</div>
<script>
async function cargar(){
 const url = encodeURIComponent('https://www.epec.com.ar/actualidad/trabajos-mejoras');
 const res = await fetch(`https://api.allorigins.win/get?url=${url}`);
 const data = await res.json();
 const html = data.contents;
 const parser = new DOMParser();
 const doc = parser.parseFromString(html,'text/html');
 const items = doc.querySelectorAll('.trabajo, article, .item-mejora');
 let out = '';
 // fallback: busca todo el texto de cortes
 const texto = doc.body.innerText;
 const lineas = texto.split('\n').filter(l=>l.includes('De ') && l.includes('barrio'));
 lineas.forEach(l=>{
   out+=`<div class="corte">${l}</div>`;
 });
 if(!out) out = `<div class="corte">${texto.slice(0,2000)}</div>`;
 document.getElementById('lista').innerHTML = out;
 window.cortes = [...document.querySelectorAll('.corte')];
}
function filtrar(){
 const q = document.getElementById('f').value.toLowerCase();
 window.cortes.forEach(c=>{
   c.style.display = c.innerText.toLowerCase().includes(q) ? 'block':'none';
 });
}
cargar();
</script>
</body></html>
