<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPEC - OnDeVoy</title>
<style>body{background:#c5ddf6;font-family:sans-serif;margin:0}.top{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;color:#1a8ac4}.logo span{color:#0a2f5c}.btn{background:#1a8ac4;color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:700}#f{width:90%;max-width:600px;display:block;margin:20px auto;padding:12px 20px;border-radius:30px;border:2px solid #8ec1e8;outline:none}.card{background:white;margin:10px auto;max-width:700px;padding:14px;border-radius:12px;border-left:6px solid #f0a500}</style>
</head><body>
<div class="top"><div class="logo">OnDeVoy<span>.com.ar</span></div><a class="btn" href="./index.html">← Volver</a></div>
<input id="f" placeholder="Filtrar por barrio... Cofico, Alberdi" oninput="filtrar()">
<div id="lista" style="text-align:center;padding:30px;font-weight:700;color:#0a2f5c">Conectando con EPEC oficial...</div>
<script>
let todos=[];
async function cargar(){
 const res = await fetch('/api/epec');
 const html = await res.text();
 const doc = new DOMParser().parseFromString(html,'text/html');
 let textos = [...doc.querySelectorAll('p')].map(p=>p.innerText.trim()).filter(t=>t.length>30 && t.match(/\d{1,2}:\d{2}/));
 if(textos.length==0){ textos = doc.body.innerText.split('\n').filter(l=>l.length>40).slice(0,80); }
 todos=textos;
 document.getElementById('lista').innerHTML = todos.map(t=>`<div class="card">${t}</div>`).join('');
}
function filtrar(){
 const q=document.getElementById('f').value.toLowerCase();
 document.getElementById('lista').innerHTML = todos.filter(t=>t.toLowerCase().includes(q)).map(t=>`<div class="card">${t}</div>`).join('');
}
cargar();
</script></body></html>
