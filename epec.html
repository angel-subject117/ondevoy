<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPEC Oficial | OnDeVoy</title>
<style>
body{background:#c5ddf6;font-family:Inter,sans-serif;margin:0}
.header{background:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;color:#1a8ac4;font-size:22px}.logo span{color:#0a2f5c}
.back{background:#1a8ac4;color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:700}
.wrap{max-width:900px;margin:16px auto;padding:0 14px}
#buscador{width:100%;padding:12px 18px;border-radius:30px;border:2px solid #8ec1e8;outline:none;font-size:15px}
.card{background:white;border-radius:12px;padding:14px;margin:10px 0;border-left:6px solid #f0a500;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card b{color:#0a2f5c}
#estado{text-align:center;padding:30px;font-weight:700;color:#0a2f5c}
small{display:block;text-align:center;margin-top:20px;color:#446;font-size:11px}
</style>
</head>
<body>
<div class="header"><div class="logo">OnDeVoy<span>.com.ar</span></div><a class="back" href="./index.html">← Volver</a></div>
<div class="wrap">
<input id="buscador" placeholder="Filtrar por barrio... Ej: Cofico, Alberdi, Nueva Córdoba" oninput="filtrar()">
<div id="estado">Leyendo https://www.epec.com.ar/actualidad/trabajos-mejoras ...</div>
<div id="lista"></div>
<small>Fuente única y oficial: EPEC. Esta página es un espejo visual de la original.</small>
</div>

<script>
let cortes = [];
async function cargar(){
 try{
  const target = 'https://www.epec.com.ar/actualidad/trabajos-mejoras';
  // proxy que si pasa Cloudflare
  const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(target));
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html,'text/html');
  const textoCompleto = doc.body.innerText;
  
  // EPEC escribe tipo: "De 08:00 a 12:00 - Barrio Cofico..."
  const lineas = textoCompleto.split('\n').map(l=>l.trim()).filter(l=>l.length>20);
  // buscamos bloques que tengan horario y barrio
  const utiles = lineas.filter(l=> /\d{1,2}:\d{2}/.test(l) );
  
  cortes = utiles.slice(0,100); // primeros 100 cortes reales
  if(cortes.length===0) throw 'vacío';
  
  document.getElementById('estado').style.display='none';
  render(cortes);
 }catch(e){
  document.getElementById('estado').innerHTML = 'EPEC tardó en responder, probá recargar. <br><a href="https://www.epec.com.ar/actualidad/trabajos-mejoras" target="_blank">Ver página oficial directa</a>';
 }
}
function render(arr){
 document.getElementById('lista').innerHTML = arr.map(t=>`<div class="card">${t}</div>`).join('');
}
function filtrar(){
 const q = document.getElementById('buscador').value.toLowerCase();
 if(!q){ render(cortes); return; }
 render(cortes.filter(c=>c.toLowerCase().includes(q)));
}
cargar();
</script>
</body>
</html>
