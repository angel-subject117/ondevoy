<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPEC - OnDeVoy</title>
<style>
body{background:#c5ddf6;font-family:sans-serif;margin:0}
.top{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.logo{font-weight:900;color:#1a8ac4;font-size:22px}.logo span{color:#0a2f5c}
.btn{background:#1a8ac4;color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:700}
#f{width:92%;max-width:650px;display:block;margin:20px auto;padding:14px 22px;border-radius:30px;border:2px solid #8ec1e8;outline:none;font-size:16px}
.card{background:white;margin:12px auto;max-width:720px;padding:16px;border-radius:12px;border-left:6px solid #f0a500;box-shadow:0 2px 8px rgba(0,0,0,.08);line-height:1.5}
.card b{color:#0a2f5c}
#estado{text-align:center;padding:20px;font-weight:700;color:#0a2f5c}
</style>
</head>
<body>
<div class="top"><div class="logo">OnDeVoy<span>.com.ar</span></div><a class="btn" href="./index.html">← Volver</a></div>
<input id="f" placeholder="Filtrar por barrio, localidad o fecha... Ej: Cofico, 08:00, Mantenimiento" oninput="filtrar()">
<div id="estado">Leyendo EPEC oficial...</div>
<div id="lista"></div>

<script>
let todos=[];
async function cargar(){
  const estado=document.getElementById('estado');
  try{
    const res=await fetch('/api/epec?t='+Date.now());
    const html=await res.text();
    if(html.includes('Error render EPEC')){ estado.textContent=html; return; }
    const doc=new DOMParser().parseFromString(html,'text/html');
    
    // EPEC oficial renderizado: cada corte está en un bloque de texto largo
    let bloques=[...doc.querySelectorAll('p, div, li, article')].map(e=>e.innerText.trim()).filter(t=>t.length>40 && t.length<800);
    bloques=[...new Set(bloques)];
    // Filtro fino: solo los que tienen horario y zona
    let cortes=bloques.filter(t=>t.match(/\d{1,2}:\d{2}/) && (t.toLowerCase().includes('zona') || t.toLowerCase().includes('barrio') || t.toLowerCase().includes('motivo')));
    
    if(cortes.length<3){
      // fallback a lineas del body si el selector cambia
      cortes=doc.body.innerText.split('\n').map(l=>l.trim()).filter(l=>l.length>50 && l.match(/\d{1,2}:\d{2}/));
    }

    todos=cortes;
    estado.textContent=`${todos.length} cortes oficiales de EPEC cargados`;
    render(todos);
  }catch(e){
    estado.textContent='Error: '+e.message+' - Probá /api/epec';
  }
}
function render(arr){
  document.getElementById('lista').innerHTML=arr.map(t=>`<div class="card">${t.replace(/\n/g,'<br>')}</div>`).join('') || '<div class="card">EPEC no publicó cortes en este momento.</div>';
}
function filtrar(){
  const q=document.getElementById('f').value.toLowerCase();
  if(!q){ render(todos); return; }
  render(todos.filter(t=>t.toLowerCase().includes(q)));
}
cargar();
</script>
</body>
</html>
