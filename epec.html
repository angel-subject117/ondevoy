<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPEC Cortes Programados | Córdoba</title>
<style>
body{font-family:system-ui;background:#93a2c4;color:#e2e8f0;margin:0;padding:16px}
h1{color:#102a5a;text-align:center}
.filtros{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
input,select{padding:10px;border-radius:8px;border:0;min-width:220px}
.card{background:#4e6b9c;border-radius:12px;padding:12px;margin:10px 0;border-left:4px solid #ffffff}
small{color:#94a3b8}
.badge{background:#ffffff;color:#000;padding:2px 8px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<a href="/index.html" style="display:inline-block;margin:8px 0;padding:8px 14px;background:#8ec1e8;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:bold">← Volver a OnDeVoy</a>
<h1>OnDeVoy | EPEC Cortes Programados ⚡</h1>  
<p style="text-align:center"><small>Fuente oficial: epec.com.ar | Total: <span id="total">...</span></small></p>
<div class="filtros">
<input id="q" placeholder="Buscar por barrio, localidad, zona... Ej: San Martin, VILLA MARIA, CORDOBA">
<input type="date" id="fecha">
<select id="localidad"><option value="">Todas las localidades</option></select>
</div>
<div id="lista">Cargando cortes oficiales...</div>
<script>
let cortes=[];
async function load(){
  const r=await fetch('/api/epec'); const j=await r.json();
  cortes=j.cortes||[]; document.getElementById('total').textContent=j.total;
  let locs=[...new Set(cortes.map(c=>c.localidad).filter(Boolean))].sort();
  let sel=document.getElementById('localidad'); locs.forEach(l=>{let o=document.createElement('option'); o.value=l; o.textContent=l; sel.appendChild(o);});
  render();
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const f=document.getElementById('fecha').value; // yyyy-mm-dd
  const loc=document.getElementById('localidad').value;
  let fil=cortes.filter(c=>{
    let texto=(c.zona+' '+(c.localidad||'')+' '+(c.motivo||'')+' '+(c.zonaResumida||'')).toLowerCase();
    if(q && !texto.includes(q)) return false;
    if(loc && c.localidad!==loc) return false;
    if(f){
      // c.fecha viene como 03/10/2026 -> convertir a yyyy-mm-dd
      let parts=c.fecha.split('/'); if(parts.length===3){ let iso=`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`; if(iso!==f) return false; }
    }
    return true;
  });
  document.getElementById('lista').innerHTML=fil.map(c=>`
    <div class="card">
      <div><b>${c.localidad||''}</b> <span class="badge">${c.fecha} ${c.horaDesde}-${c.horaHasta}</span></div>
      <div style="margin:6px 0">📍 ${c.zona||c.zonaResumida||'Zona a confirmar'}</div>
      <div><small>🔧 ${c.motivo||''} - ${c.motivoResumido||''} (${c.afectacion||'parcial'})</small></div>
      <div><small>${c.motivoExplicacion||''}</small></div>
    </div>
  `).join('') || '<p>No hay cortes para ese filtro.</p>';
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('fecha').addEventListener('change',render);
document.getElementById('localidad').addEventListener('change',render);
load();
</script>
</body>
</html>
