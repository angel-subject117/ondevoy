<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPCs - OnDeVoy.com.ar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#c5ddf6;min-height:100vh}
.header{background:white;border-radius:0 0 20px 20px;padding:14px 32px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.logo-title{font-size:32px;font-weight:900;color:#1a8ac4}.logo-title span{color:#0a2f5c}
.logo-sub{font-size:13px;color:#5a8fb8;font-weight:500;margin-top:2px}
.nav{display:flex;align-items:center;gap:22px;font-size:14px}
.nav a{text-decoration:none;color:#4a4a4a;padding:6px 12px;border-radius:20px}
.nav a.active{background:#8ec1e8;color:white;font-weight:700;padding:6px 16px}
.nav .cr{background:#6faad8;color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.main{max-width:1280px;margin:0 auto;padding:28px 24px 10px}
.back-btn{display:inline-block;background:#8ec1e8;color:white;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.title h1{font-size:30px;font-weight:800;color:#102a5a}
.title p{font-size:14px;color:#2a2a2a;margin-top:4px}
.location-badge{border:1.5px solid #5a9bc8;color:#2a5a8a;background:rgba(255,255,255,0.4);padding:6px 14px;border-radius:20px;font-size:13px}
.services-box{background:rgba(225,235,250,0.7);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,0.6)}
.services-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.services-header h2{font-size:22px;font-weight:800;color:#0a2a5c}
.services-header .meta{font-size:13px;color:#2a5a8a}
.buscador{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid #d6e6f5;font-size:13px;outline:none;margin-bottom:12px;background:white}
.filtros{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:10px}
.chip{white-space:nowrap;padding:6px 12px;border:1.5px solid #d6e6f5;border-radius:20px;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#2a5a8a}
.chip.active{background:#8ec1e8;color:white;border-color:#8ec1e8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:white;border-radius:14px;padding:14px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,0.06);border:1.5px solid #d6e6f5;transition:0.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.12)}
.card h3{font-size:15px;font-weight:800;color:#0a1f44;margin-bottom:4px}
.card small{font-size:11.5px;color:#333;line-height:1.3;display:block}
.tag{display:inline-block;background:#e1eefb;color:#0a2f5c;border-radius:12px;padding:2px 8px;font-size:10.5px;font-weight:600;margin:4px 4px 0 0}
.badge-green{background:#e6f7e6;border:1px solid #bbf7d0;padding:8px;border-radius:10px;font-size:12px;color:#166534;margin-top:8px}
.btn{display:block;width:100%;margin-top:10px;background:#2d7fc0;color:white;text-align:center;padding:8px;border-radius:20px;text-decoration:none;font-weight:700;font-size:12.5px}
.btn-outline{background:#e1eefb;color:#0a2f5c;border:1.5px solid #8ec1e8}
.report{display:flex;gap:6px;margin-top:8px}
.report button{flex:1;padding:6px;border-radius:20px;border:1.5px solid #d6e6f5;background:white;cursor:pointer;font-size:11.5px;font-weight:600}
.detalle{background:white;border-radius:14px;padding:18px;border:1.5px solid #d6e6f5}
.map-btn{display:block;text-align:center;background:#e1eefb;color:#0a2f5c;border:1.5px solid #8ec1e8;padding:6px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-decoration:none;margin-top:8px}
.footer{text-align:center;padding:18px 10px 12px;font-size:11.5px;color:#2a4a6a}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 48 60" width="52" height="52"><path d="M24 0 C10 0 0 10 0 22 C0 38 24 60 24 60 C24 60 48 38 48 22 C48 10 38 0 24 0 Z" fill="#d6ecff" stroke="#3a8ac0" stroke-width="2.5"/><circle cx="24" cy="20" r="11" fill="white" stroke="#3a8ac0" stroke-width="2.2"/></svg>
    <div><div class="logo-title">OnDeVoy<span>.com.ar</span></div><div class="logo-sub">Todo Córdoba en un solo lugar</div></div>
  </div>
  <nav class="nav"><a href="./index.html">Inicio</a><a href="#" class="active">Servicios</a><a href="#">🔔 Alertas</a><a href="#">Ayuda</a><div class="cr">CR</div></nav>
</header>
<main class="main">
  <a href="./index.html" class="back-btn">← Volver a OnDeVoy</a>
  <div class="title-row"><div class="title"><h1>🏛️ CPCs de Córdoba</h1><p>17 CPCs con dirección, horarios y turnos en MiDocta</p></div><div class="location-badge">📍 Córdoba, Argentina</div></div>

  <div class="services-box">
    <div id="app">Cargando CPCs...</div>
  </div>
</main>
<footer class="footer"><strong>OnDeVoy.com.ar</strong> • Datos oficiales Municipalidad de Córdoba</footer>

<script>
const API = '/api/cpcs';
const params = new URLSearchParams(location.search);
const id = params.get('id');

async function load(){
  const res = await fetch(API);
  const data = await res.json();
  if(id){
    const cpc = data.find(c=>c.id===id) || data;
    renderDetalle(cpc);
  } else {
    renderLista(data);
  }
}

function renderLista(cpcs){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="services-header"><h2>PROVINCIALES - 17 CPCs</h2><div class="meta">Tocá uno para ver detalle</div></div>
    <input id="q" class="buscador" placeholder="🔍 Buscar por barrio o dirección... Ej: Argüello, Colón, Empalme">
    <div class="filtros" id="filtros"></div>
    <div class="grid" id="grid"></div>
  `;
  const zonas = [...new Set(cpcs.map(c=>c.zona))];
  const filtrosEl = document.getElementById('filtros');
  filtrosEl.innerHTML = `<div class="chip active" data-z="todos">Todos</div>` + zonas.map(z=>`<div class="chip" data-z="${z}">${z}</div>`).join('');
  
  const grid = document.getElementById('grid');
  const qEl = document.getElementById('q');
  let zonaActiva = 'todos';

  function pintar(){
    const q = qEl.value.toLowerCase();
    const filtrados = cpcs.filter(c=>{
      const porTexto = (c.nombre+c.direccion).toLowerCase().includes(q);
      const porZona = zonaActiva==='todos' || c.zona===zonaActiva;
      return porTexto && porZona;
    });
    grid.innerHTML = filtrados.map(c=>`
      <div class="card">
        <h3>${c.nombre}</h3>
        <small>📍 ${c.direccion}</small>
        <small>📌 ${c.zona} • ${c.horario}</small>
        <div style="margin-top:6px">${c.tramites.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="badge-green">👥 ${c.estado_vecinos}</div>
        <a class="btn" href="cpcs.html?id=${c.id}">Ver detalle</a>
        <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.direccion + ' Cordoba')}">📍 Cómo llegar</a>
      </div>
    `).join('');
  }
  filtrosEl.onclick = e=>{
    if(!e.target.dataset.z) return;
    zonaActiva = e.target.dataset.z;
    document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active', ch.dataset.z===zonaActiva));
    pintar();
  };
  qEl.oninput = pintar;
  pintar();
}

function renderDetalle(c){
  const app = document.getElementById('app');
  app.innerHTML = `
    <a class="back-btn" href="cpcs.html" style="margin-bottom:12px">← Volver a todos los CPCs</a>
    <div class="detalle">
      <h2 style="margin:0;color:#0a2f5c">${c.nombre}</h2>
      <p style="margin:6px 0;color:#555;font-size:13px">${c.direccion} - Zona ${c.zona}</p>
      <p style="font-size:13px"><b>Horario:</b> ${c.horario} <br><small>${c.horario_detalle||''}</small></p>
      <p style="font-size:13px"><b>Tel:</b> ${c.telefono}</p>
      <div style="margin:8px 0">${c.tramites.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      
      <div class="badge-green" style="margin-top:14px">👥 Estado hoy: ${c.estado_vecinos}<br><small>Reporte de vecinos de OnDeVoy</small></div>
      <div class="report">
        <button onclick="alert('¡Gracias! Reportaste VACÍO en ${c.nombre}')">🟢 Vacío</button>
        <button onclick="alert('¡Gracias! Reportaste NORMAL')">🟡 Normal</button>
        <button onclick="alert('¡Gracias! Reportaste LLENO')">🔴 Lleno</button>
      </div>

      <a class="btn" style="margin-top:16px" target="_blank" href="${c.link_turno}">Sacar turno en MiDocta →</a>
      <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.direccion + ' Cordoba')}">📍 Abrir en Maps</a>
      
      <p style="font-size:11px;color:#888;margin-top:12px">* OnDeVoy no muestra turnos en tiempo real de la Muni. Te lleva directo a MiDocta oficial.</p>
    </div>
  `;
}

load();
</script>
</body>
</html>
