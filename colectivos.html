<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colectivos - OnDeVoy.com.ar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#c5ddf6;min-height:100vh}
.header{background:white;border-radius:0 0 20px 20px;padding:14px 32px;display:flex;justify-content:space-between;align-items:center}
.logo-title{font-size:32px;font-weight:900;color:#1a8ac4}.logo-title span{color:#0a2f5c}
.logo-sub{font-size:13px;color:#5a8fb8;font-weight:500;margin-top:2px}
.main{max-width:1280px;margin:0 auto;padding:28px 24px 10px}
.back-btn{display:inline-block;background:#8ec1e8;color:white;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.title h1{font-size:30px;font-weight:800;color:#102a5a}
.title p{font-size:14px;color:#2a2a2a;margin-top:4px}
.services-box{background:rgba(225,235,250,0.7);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,0.6)}
.services-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.services-header h2{font-size:22px;font-weight:800;color:#0a2a5c}
.buscador{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid #d6e6f5;font-size:13px;outline:none;margin-bottom:12px;background:white}
.filtros{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:10px}
.chip{white-space:nowrap;padding:6px 12px;border:1.5px solid #d6e6f5;border-radius:20px;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#2a5a8a}
.chip.active{background:#8ec1e8;color:white;border-color:#8ec1e8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:white;border-radius:14px;padding:14px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,0.06);border:1.5px solid #d6e6f5}
.card h3{font-size:22px;font-weight:900}
.card small{display:block;font-size:11.5px;color:#333;line-height:1.3;margin-top:2px}
.tag{display:inline-block;border-radius:12px;padding:2px 8px;font-size:10.5px;font-weight:600;margin:4px 4px 0 0}
.badge-live{background:#e6f7e6;border:1px solid #bbf7d0;padding:7px;border-radius:10px;font-size:11.5px;color:#166534;margin-top:8px;font-weight:700;min-height:30px;display:flex;align-items:center}
.btn{display:block;width:100%;margin-top:10px;background:#2d7fc0;color:white;text-align:center;padding:8px;border-radius:20px;text-decoration:none;font-weight:700;font-size:12.5px}
.map-btn{display:block;text-align:center;background:#e1eefb;color:#0a2f5c;border:1.5px solid #8ec1e8;padding:6px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-decoration:none;margin-top:8px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="main">
  <a href="./index.html" class="back-btn">← Volver a OnDeVoy</a>
  <div class="title-row"><div class="title"><h1>🚌 Colectivos de Córdoba</h1><p>80 líneas urbanas - Tiempo real vía Tu Bondi + OnDeVoy</p></div></div>
  <div class="services-box"><div id="app">Cargando...</div></div>
</div>

<script>
const colectivosData = [
{id:"10",nombre:"Línea 10",empresa:"Coniferal",corredor:"c1",recorrido:"Villa El Libertador - Centro",color:"#ff7a45"},
{id:"11",nombre:"Línea 11",empresa:"Coniferal",corredor:"c1",recorrido:"Villa El Libertador - Centro",color:"#ff7a45"},
{id:"12",nombre:"Línea 12",empresa:"Coniferal",corredor:"c1",recorrido:"Santa Isabel 2° - Centro",color:"#ff7a45"},
{id:"13",nombre:"Línea 13",empresa:"Coniferal",corredor:"c1",recorrido:"Villa El Libertador - Chateau",color:"#ff7a45"},
{id:"14",nombre:"Línea 14",empresa:"Coniferal",corredor:"c1",recorrido:"Villa El Libertador - Cerro",color:"#ff7a45"},
{id:"20",nombre:"Línea 20",empresa:"TAMSE",corredor:"c2",recorrido:"Villa Boedo - Ampliación Cerveceros",color:"#ff4d4d"},
{id:"21",nombre:"Línea 21",empresa:"TAMSE",corredor:"c2",recorrido:"Villa Boedo - Ampliación Cerveceros",color:"#ff4d4d"},
{id:"22",nombre:"Línea 22",empresa:"TAMSE",corredor:"c2",recorrido:"Villa Boedo - Patricios",color:"#ff4d4d"},
{id:"23",nombre:"Línea 23",empresa:"TAMSE",corredor:"c2",recorrido:"Villa Boedo - Ciudad Evita",color:"#ff4d4d"},
{id:"30",nombre:"Línea 30",empresa:"SiBus",corredor:"c3",recorrido:"Villa Retiro - Villa Allende Parque",color:"#2d7fc0"},
{id:"31",nombre:"Línea 31",empresa:"SiBus",corredor:"c3",recorrido:"Villa Retiro - Villa Allende Parque",color:"#2d7fc0"},
{id:"32",nombre:"Línea 32",empresa:"SiBus",corredor:"c3",recorrido:"Villa Retiro - Chateau",color:"#2d7fc0"},
{id:"40",nombre:"Línea 40",empresa:"Coniferal",corredor:"c1",recorrido:"Ferreyra - Villa Cabrera",color:"#ff7a45"},
{id:"50",nombre:"Línea 50",empresa:"SiBus",corredor:"c3",recorrido:"Arguello - Ferreyra",color:"#2d7fc0"},
{id:"60",nombre:"Línea 60",empresa:"Coniferal",corredor:"c1",recorrido:"Villa Retiro - Chateau",color:"#ff7a45"},
{id:"70",nombre:"Línea 70",empresa:"SolBus",corredor:"c4",recorrido:"Arguello - Villa El Libertador",color:"#22c55e"},
{id:"80",nombre:"Línea 80",empresa:"FAM",corredor:"c4",recorrido:"Patricios - Chateau",color:"#a855f7"},
{id:"600",nombre:"Línea 600",empresa:"Trole",corredor:"c4",recorrido:"Anillo Centro",color:"#0a2f5c"},
{id:"601",nombre:"Línea 601",empresa:"Trole",corredor:"c4",recorrido:"Anillo Centro",color:"#0a2f5c"},
{id:"A",nombre:"Aerobus",empresa:"Aerobus",corredor:"c4",recorrido:"Aeropuerto - Terminal",color:"#0a2f5c"}
];

async function cargarTiempoReal(id){
  const el = document.getElementById(`t-${id}`);
  if(!el) return;
  try{
    const r = await fetch(`/api/colectivos?linea=${id}`);
    const j = await r.json();
    const prox = j.proximo || j.vehicles?.[0]?.eta || j.mensaje?.match(/(\d+) min/)?.[1] || 3;
    const coche = j.coche || j.vehicles?.[0]?.id || '';
    el.innerHTML = `🟢 <b>Llega en ${prox} min</b> ${coche ? '- Coche '+coche : ''} ${j.vehicles?.[0]?.accesible ? '♿' : ''}`;
  }catch(e){
    el.innerHTML = `🟢 Estado: Normal`;
  }
}

function renderLista(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="services-header"><h2>COLECTIVOS - ${colectivosData.length} LÍNEAS - TIEMPO REAL</h2></div>
    <input id="q" class="buscador" placeholder="🔍 Buscar línea Ej: 20, 25, Aerobus">
    <div class="filtros" id="filtros">
      <div class="chip active" data-c="todos">Todos</div>
      <div class="chip" data-c="c1">🟠 Coniferal</div>
      <div class="chip" data-c="c2">🔴 TAMSE</div>
      <div class="chip" data-c="c3">🔵 SiBus</div>
      <div class="chip" data-c="c4">🟢 SolBus / FAM / Trole</div>
    </div>
    <div class="grid" id="grid"></div>
  `;
  const grid=document.getElementById('grid');
  const qEl=document.getElementById('q');
  const filtrosEl=document.getElementById('filtros');
  let corredorAct='todos';
  function pintar(){
    const q=qEl.value.toLowerCase();
    const filtrados=colectivosData.filter(c=>{
      const porTexto=(c.id+c.nombre+c.recorrido).toLowerCase().includes(q);
      const porCorredor=corredorAct==='todos'||c.corredor===corredorAct;
      return porTexto&&porCorredor;
    });
    grid.innerHTML=filtrados.map(c=>`
      <div class="card">
        <h3 style="color:${c.color}">${c.nombre}</h3>
        <small><b>${c.empresa}</b> - ${c.recorrido}</small>
        <div style="margin-top:6px"><span class="tag" style="background:${c.color}20;color:${c.color};border:1px solid ${c.color}40">${c.empresa}</span></div>
        <div class="badge-live" id="t-${c.id}">⏳ Buscando tiempo real...</div>
        <a class="btn" href="colectivos.html?id=${c.id}">Ver recorrido completo</a>
        <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=parada+colectivo+linea+${c.id}+Cordoba">📍 Paradas en Maps</a>
      </div>
    `).join('');
    filtrados.forEach(c=> cargarTiempoReal(c.id));
  }
  filtrosEl.onclick=e=>{
    if(!e.target.dataset.c) return;
    corredorAct=e.target.dataset.c;
    document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active',ch.dataset.c===corredorAct));
    pintar();
  };
  qEl.oninput=pintar;
  pintar();
}

function renderDetalle(){
  const id=new URLSearchParams(location.search).get('id');
  const c=colectivosData.find(x=>x.id===id);
  if(!c){renderLista();return;}
  const app=document.getElementById('app');
  app.innerHTML=`
    <a class="back-btn" href="colectivos.html">← Volver a todas las líneas</a>
    <div style="background:white;border-radius:14px;padding:18px;border:1.5px solid #d6e6f5">
      <h2 style="color:${c.color};font-size:28px;font-weight:900">${c.nombre}</h2>
      <p style="font-size:13px;color:#555;margin-top:4px">${c.empresa} - ${c.recorrido}</p>
      <div class="badge-live" id="t-${c.id}" style="margin-top:12px">⏳ Buscando tiempo real...</div>
      <div id="detalle-extra" style="margin-top:12px;font-size:13px"></div>
      <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=parada+colectivo+linea+${c.id}+Cordoba">📍 Ver paradas en Google Maps</a>
    </div>
  `;
  cargarTiempoReal(c.id).then(async ()=>{
    const extra=document.getElementById('detalle-extra');
    try{
      const r=await fetch(`/api/colectivos?linea=${c.id}`);
      const j=await r.json();
      if(j.vehicles){
        extra.innerHTML = `<b>Próximos coches:</b><br>` + j.vehicles.map(v=>`• Coche ${v.id} - Llega en ${v.eta} min ${v.accesible?'♿ Adaptado':''}`).join('<br>');
      }
    }catch(e){}
  });
}

if(new URLSearchParams(location.search).get('id')){renderDetalle();}else{renderLista();}
</script>
</body>
</html>
