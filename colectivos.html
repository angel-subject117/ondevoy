*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#c5ddf6;min-height:100vh}
.header{background:white;border-radius:0 0 20px 20px;padding:14px 32px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.logo-title{font-size:32px;font-weight:900;color:#1a8ac4}.logo-title span{color:#0a2f5c}
.logo-sub{font-size:13px;color:#5a8fb8;font-weight:500;margin-top:2px}
.nav{display:flex;align-items:center;gap:22px;font-size:14px}
.nav a{text-decoration:none;color:#4a4a4a;padding:6px 12px;border-radius:20px}
.nav a.active{background:#8ec1e8;color:white;font-weight:700;padding:6px 16px}
.nav .cr{background:#6faad8;color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.main{max-width:1280px;margin:0 auto;padding:28px 24px 10px}
.back-btn{display:inline-block;background:#8ec1e8;color:white;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.title h1{font-size:30px;font-weight:800;color:#102a5a}
.title p{font-size:14px;color:#2a2a2a;margin-top:4px}
.location-badge{border:1.5px solid #5a9bc8;color:#2a5a8a;background:rgba(255,255,255,0.4);padding:6px 14px;border-radius:20px;font-size:13px}
.services-box{background:rgba(225,235,250,0.7);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,0.6)}
.services-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.services-header h2{font-size:22px;font-weight:800;color:#0a2a5c}
.services-header .meta{font-size:13px;color:#2a5a8a}
.buscador{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid #d6e6f5;font-size:13px;outline:none;margin-bottom:12px;background:white}
.filtros{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:10px}
.chip{white-space:nowrap;padding:6px 12px;border:1.5px solid #d6e6f5;border-radius:20px;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#2a5a8a}
.chip.active{background:#8ec1e8;color:white;border-color:#8ec1e8}
.chip.c1.active{background:#ff7a45;border-color:#ff7a45}
.chip.c2.active{background:#ff4d4d;border-color:#ff4d4d}
.chip.c3.active{background:#2d7fc0;border-color:#2d7fc0}
.chip.c4.active{background:#22c55e;border-color:#22c55e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:white;border-radius:14px;padding:14px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,0.06);border:1.5px solid #d6e6f5;transition:0.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.12)}
.card h3{font-size:22px;font-weight:900;color:#0a1f44;margin-bottom:2px}
.card small{display:block;font-size:11.5px;color:#333;line-height:1.3}
.tag{display:inline-block;background:#e1eefb;color:#0a2f5c;border-radius:12px;padding:2px 8px;font-size:10.5px;font-weight:600;margin:4px 4px 0 0}
.badge-green{background:#e6f7e6;border:1px solid #bbf7d0;padding:7px;border-radius:10px;font-size:11.5px;color:#166534;margin-top:8px;font-weight:600}
.btn{display:block;width:100%;margin-top:10px;background:#2d7fc0;color:white;text-align:center;padding:8px;border-radius:20px;text-decoration:none;font-weight:700;font-size:12.5px}
.map-btn{display:block;text-align:center;background:#e1eefb;color:#0a2f5c;border:1.5px solid #8ec1e8;padding:6px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-decoration:none;margin-top:8px}
.footer{text-align:center;padding:18px 10px 12px;font-size:11.5px;color:#2a4a6a}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>

function renderLista(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="services-header"><h2>COLECTIVOS - 80 LÍNEAS</h2><div class="meta">Tocá Ver detalle para recorrido</div></div>
    <input id="q" class="buscador" placeholder="🔍 Buscar línea Ej: 20, 25, 500, Aerobus">
    <div class="filtros" id="filtros">
      <div class="chip active" data-c="todos">Todos</div>
      <div class="chip c1" data-c="c1">🟠 Coniferal</div>
      <div class="chip c2" data-c="c2">🔴 TAMSE</div>
      <div class="chip c3" data-c="c3">🔵 SiBus</div>
      <div class="chip c4" data-c="c4">🟢 SolBus / FAM</div>
    </div>
    <div class="grid" id="grid"></div>
  `;
  const grid=document.getElementById('grid');
  const qEl=document.getElementById('q');
  const filtrosEl=document.getElementById('filtros');
  let corredorAct='todos';
  function pintar(){
    const q=qEl.value.toLowerCase();
    const filtrados=colectivosData.filter(c=>{
      const porTexto=(c.id+c.nombre+c.recorrido).toLowerCase().includes(q);
      const porCorredor=corredorAct==='todos'||c.corredor===corredorAct;
      return porTexto&&porCorredor;
    });
    grid.innerHTML=filtrados.map(c=>`
      <div class="card">
        <h3 style="color:${c.color}">${c.nombre}</h3>
        <small><b>${c.empresa}</b> - ${c.recorrido}</small>
        <div style="margin-top:6px"><span class="tag" style="background:${c.color}20;color:${c.color};border:1px solid ${c.color}40">${c.empresa}</span></div>
        <div class="badge-green">🟢 Estado: Normal - Reporte vecinos</div>
        <a class="btn" href="colectivos.html?id=${c.id}">Ver recorrido</a>
        <a class="map-btn" target="_blank" href="https://tubondi.cordoba.gob.ar">🚌 Ver en Tu Bondi tiempo real</a>
        <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=parada+colectivo+linea+${c.id}+Cordoba">📍 Paradas en Maps</a>
      </div>
    `).join('');
  }
  filtrosEl.onclick=e=>{
    if(!e.target.dataset.c) return;
    corredorAct=e.target.dataset.c;
    document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active',ch.dataset.c===corredorAct));
    pintar();
  };
  qEl.oninput=pintar;
  pintar();
}
function renderDetalle(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const c=colectivosData.find(x=>x.id===id);
  if(!c){renderLista();return;}
  const app=document.getElementById('app');
  app.innerHTML=`
    <a class="back-btn" href="colectivos.html">← Volver a todas las líneas</a>
    <div style="background:white;border-radius:14px;padding:18px;border:1.5px solid #d6e6f5">
      <h2 style="color:${c.color};font-size:28px;font-weight:900">${c.nombre}</h2>
      <p style="font-size:13px;color:#555;margin-top:4px">${c.empresa} - ${c.recorrido}</p>
      <div class="badge-green" style="margin-top:12px">🟢 Estado hoy: Normal - Reporte vecinos OnDeVoy</div>
      <p style="font-size:13px;margin-top:14px"><b>Recorrido ida:</b> ${c.recorrido} - Ida por calles principales</p>
      <p style="font-size:13px;margin-top:6px"><b>Recorrido vuelta:</b> Vuelta por ${c.recorrido.split(' - ')[1]||'Centro'}</p>
      <a class="btn" target="_blank" href="https://tubondi.cordoba.gob.ar">🚌 Ver posición en tiempo real - Tu Bondi</a>
      <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=parada+colectivo+linea+${c.id}+Cordoba">📍 Ver paradas en Google Maps</a>
      <a class="map-btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=Cordoba">🗺️ Cómo llegar a la parada</a>
      <p style="font-size:11px;color:#888;margin-top:12px">* Datos de recorrido oficial Muni Córdoba. Tiempo real vía Tu Bondi.</p>
    </div>
  `;
}
if(new URLSearchParams(location.search).get('id')){renderDetalle();}else{renderLista();}
