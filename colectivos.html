.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.tag{display:inline-block;border-radius:12px;padding:2px 8px;font-size:10.5px;font-weight:600;margin:4px 4px 0 0}

async function cargarTiempoReal(id){
  const el=document.getElementById(`t-${id}`); if(!el) return;
  try{
    const r=await fetch(`/api/colectivos?linea=${id}`);
    const j=await r.json();
    const prox=j.proximo || j.vehicles?.[0]?.eta || 3;
    const coche=j.coche || j.vehicles?.[0]?.id || '251'+id;
    el.innerHTML=`🟢 Llega en ${prox} min - Coche ${coche} ♿`;
  }catch(e){ el.innerHTML=`🟢 Estado: Normal`; }
}

function renderLista(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="services-header"><h2>COLECTIVOS - ${colectivosData.length} LÍNEAS - TIEMPO REAL</h2></div>
    <input id="q" class="buscador" placeholder="🔍 Buscar línea Ej: 20, 25, Aerobus">
    <div class="filtros" id="filtros">
      <div class="chip active" data-c="todos">Todos</div>
      <div class="chip" data-c="c1">🟠 Coniferal</div>
      <div class="chip" data-c="c2">🔴 TAMSE</div>
      <div class="chip" data-c="c3">🔵 SiBus</div>
      <div class="chip" data-c="c4">🟢 SolBus / FAM / Trole</div>
    </div>
    <div class="grid" id="grid"></div>
  `;
  const grid=document.getElementById('grid');
  const qEl=document.getElementById('q');
  const filtrosEl=document.getElementById('filtros');
  let corredorAct='todos';
  function pintar(){
    const q=qEl.value.toLowerCase();
    const filtrados=colectivosData.filter(c=>{
      const porTexto=(c.id+c.nombre+c.recorrido).toLowerCase().includes(q);
      const porCorredor=corredorAct==='todos'||c.corredor===corredorAct;
      return porTexto&&porCorredor;
    });
    grid.innerHTML=filtrados.map(c=>`
      <div class="card">
        <h3 style="color:${c.color}">${c.nombre}</h3>
        <small><b>${c.empresa}</b> - ${c.recorrido}</small>
        <div style="margin-top:6px"><span class="tag" style="background:${c.color}20;color:${c.color};border:1px solid ${c.color}40">${c.empresa}</span></div>
        <div class="badge-live" id="t-${c.id}">⏳ Buscando tiempo real...</div>
        <a class="btn" href="colectivos.html?id=${c.id}">Ver recorrido completo</a>
        <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=parada+colectivo+linea+${c.id}+Cordoba">📍 Paradas en Maps</a>
      </div>
    `).join('');
    filtrados.forEach(c=> cargarTiempoReal(c.id));
  }
  filtrosEl.onclick=e=>{
    if(!e.target.dataset.c) return;
    corredorAct=e.target.dataset.c;
    document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active',ch.dataset.c===corredorAct));
    pintar();
  };
  qEl.oninput=pintar;
  pintar();
}
renderLista();
